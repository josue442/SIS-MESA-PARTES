syntax = "proto3";

package maestros;

option go_package = "./maestros";

// Persona representa la identidad institucional central.
// Los demás servicios deben referenciarla por su UUID estable.
message Persona {
  string id = 1;
  string tipo_documento = 2;
  string numero_documento = 3;
  string nombres = 4;
  string apellido_paterno = 5;
  string apellido_materno = 6;

  string fecha_nacimiento = 7;
  string sexo = 8;

  string correo_personal = 9;
  string telefono = 10;

  bool activo = 11;

  string created_at = 12;
  string updated_at = 13;
}

// Consulta una persona mediante su UUID institucional.
message GetPersonaRequest {
  string id = 1;
}

message GetPersonaResponse {
  Persona persona = 1;
}

service Maestros {
  rpc GetPersona(GetPersonaRequest) returns (GetPersonaResponse);
}